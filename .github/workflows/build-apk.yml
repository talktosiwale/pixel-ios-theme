
name: Build Pixel iOS Theme APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Pixel iOS Theme APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract Android project
        run: |
          unzip -o Pixel_iOS_Theme_App_Project.zip -d .
          test -d Pixel_iOS_Theme_App_Project

      - name: Check Gradle wrapper
        working-directory: Pixel_iOS_Theme_App_Project
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper file gradlew is missing."
            exit 1
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: Pixel_iOS_Theme_App_Project
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-iOS-Theme-debug-apk
          path: Pixel_iOS_Theme_App_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
