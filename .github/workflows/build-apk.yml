name: Build Pixel iOS Theme APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Extract Android project
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q Pixel_iOS_Theme_App_Project.zip -d extracted

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found in the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/gradlew"

          "$PROJECT_DIR/gradlew" \
            -p "$PROJECT_DIR" \
            assembleDebug \
            --no-daemon

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-iOS-Theme-APK
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
