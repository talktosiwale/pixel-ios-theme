
name: Build Pixel iOS Theme APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Pixel iOS Theme APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Pixel_iOS_Theme_App_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP file was not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -o -q "$ZIP_FILE" -d extracted

          echo "Files extracted from project ZIP:"
          find extracted -maxdepth 4 -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradlew' \) -print

          PROJECT_FILE=""

          while IFS= read -r file; do
            if [[ "$file" == */settings.gradle || \
                  "$file" == */settings.gradle.kts ]]; then
              PROJECT_FILE="$file"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' | sort
          )

          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_FILE="$(find extracted -type f \
              \( -name build.gradle \
              -o -name build.gradle.kts \) \
              -not -path '*/build/*' \
              -not -path '*/.gradle/*' | head -n 1 || true)"

            if [ -z "$PROJECT_FILE" ]; then
              echo "::error::No Gradle project files were found in the ZIP."
              echo "The ZIP must contain settings.gradle or build.gradle."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::The selected directory is not a Gradle project."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper is missing."
            echo "The installed Gradle distribution will be used."
          fi

          sdkmanager --version
          adb version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            "$PROJECT_DIR/gradlew" \
              -p "$PROJECT_DIR" \
              --no-daemon \
              --stacktrace \
              assembleDebug
          else
            gradle \
              -p "$PROJECT_DIR" \
              --no-daemon \
              --stacktrace \
              assembleDebug
          fi

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK was generated."
            echo "Searching for APK files:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/app-debug.apk"

          echo "APK created successfully."
          ls -lh "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-iOS-Theme-debug-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 7
