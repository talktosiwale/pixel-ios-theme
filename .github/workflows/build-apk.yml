
name: Build Pixel iOS Theme APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project
        run: unzip Pixel_iOS_Theme_App_Project.zip

      - name: Build APK
        working-directory: Pixel_iOS_Theme_App_Project
        run: |
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Pixel-iOS-Theme-debug-apk
          path: Pixel_iOS_Theme_App_Project/app/build/outputs/apk/debug/app-debug.apk
          
